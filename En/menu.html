  <script type="text/javascript">
   function MRestore() {
    var i,x,a=document.Msr; for(i=0;a&&i<a.length&&(x=a[i])&&x.oSrc;i++) x.src=x.oSrc;
   }
   function Mload() {
    var d=document; if(d.images){
     if(!d.Mp) d.Mp=new Array();
     var i,j=d.Mp.length,a=Mload.arguments;
     for(i=0; i<a.length; i++)
 if (a[i].indexOf("#")!=0){
      d.Mp[j]=new Image; d.Mp[j++].src=a[i];
     }
    }
   }
   function MfindO(n, d) {
    var p,i,x;  if(!d) d=document; if((p=n.indexOf("?"))>0&&parent.frames.length) {
     d=parent.frames[n.substring(p+1)].document; n=n.substring(0,p);
    }
    if(!(x=d[n])&&d.all) x=d.all[n];
    for (i=0;!x&&i<d.forms.length;i++) x=d.forms[i][n];
    for(i=0;!x&&d.layers&&i<d.layers.length;i++) x=MfindO(n,d.layers[i].document); return x;
   }
   function Mswap() {
    var i,j=0,x,a=Mswap.arguments; document.Msr=new Array;
    for(i=0;i<(a.length-2);i+=3)
    if ((x=MfindO(a[i]))!=null){
     document.Msr[j++]=x;
     if(!x.oSrc) x.oSrc=x.src; x.src=a[i+2];
    }
   }
  </script>
